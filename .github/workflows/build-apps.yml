name: Build Multiplatform App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            icon: icon.ico
            sep: ";"
          - os: macos-latest
            icon: icon.icns
            sep: ":"
          - os: ubuntu-latest
            icon: ""
            sep: ":"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Usa la acción oficial de UV (Rápida, segura y multiplataforma)
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    # Instalamos las dependencias usando la instalación global del sistema de la máquina virtual
    - name: Install dependencies
      run: |
        uv pip install --system pyinstaller pillow

    - name: Convert Icons (macOS and Windows)
      shell: bash
      run: |
        if [ -f "icon.png" ]; then
          if [ "$RUNNER_OS" == "Windows" ]; then
            python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (256, 256)])"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mkdir -p icon.iconset
            sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
            sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
            sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
            sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
            sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
            sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
            sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
            sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
            sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
            sips -z 1024 1024 icon.png --out icon.iconset/icon_512x512@2x.png
            iconutil -c icns icon.iconset
            rm -rf icon.iconset
          fi
        else
          echo "⚠️ No se encontró icon.png. Se compilará con el icono por defecto."
        fi

    - name: Run PyInstaller
      shell: bash
      run: |
        # Crear la carpeta static si por alguna razón no se subió a Git (a veces carpetas vacías no se suben)
        mkdir -p static
        
        ICON_CMD=""
        if [ -n "${{ matrix.icon }}" ] && [ -f "${{ matrix.icon }}" ]; then
          ICON_CMD="--icon=${{ matrix.icon }}"
        fi
        
        WINDOWED_CMD=""
        if [ "$RUNNER_OS" != "Linux" ]; then
          WINDOWED_CMD="--windowed"
        fi

        pyinstaller --onefile $WINDOWED_CMD --add-data "static${{ matrix.sep }}static" $ICON_CMD --name "NLP-Flow" main.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NLP-Flow-${{ matrix.os }}
        path: dist/
